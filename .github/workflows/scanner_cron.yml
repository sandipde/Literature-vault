name: Periodic Scanner
on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

concurrency:
  group: literature-vault-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/scan_arxiv.py
      - run: |
          git config user.name "scanner-bot[bot]"
          git config user.email "scanner-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add notes/ sources.json seen_papers.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-scan update [skip ci]"
            git push origin HEAD:main
          fi
