name: Periodic Scanner
on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/scan_arxiv.py
      - run: |
          git config user.name "scanner-bot[bot]"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add notes/ seen_papers.json
          git commit -m "chore: auto-scan update [skip ci]" || exit 0
          git push
