name: Ingest Issue Reference

on:
  issues:
    types: [opened]

concurrency:
  group: literature-vault-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process:
    if: ${{ !contains(github.event.issue.body, '<!-- literature-vault:scan-settings:v1 -->') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate note from issue
        id: ingest
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
        run: python -m scripts.ingest

      - name: Comment on duplicate
        if: steps.ingest.outputs.result == 'duplicate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          NOTE_PATH: ${{ steps.ingest.outputs.note_path }}
        run: |
          gh issue comment "${ISSUE_NUM}" --body "This source is already captured in [${NOTE_PATH}](https://github.com/${GITHUB_REPOSITORY}/blob/main/${NOTE_PATH})."

      - name: Commit registry and note updates
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add notes/ sources.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: ingest #${ISSUE_NUM}"
            git push origin HEAD:main
          fi
          gh issue close "${ISSUE_NUM}"
