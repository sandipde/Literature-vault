name: Close processed capture issues

# One run. The cloud agent can push notes but cannot comment on or close issues.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/close_processed_issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close the capture issues that were ingested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          close() {
            number="$1"
            body="$2"
            gh issue comment "${number}" --body "${body}"
            gh issue close "${number}" --reason completed
          }
          close 214 "This source is already captured in [notes/crossref_Reweighting_Free_Energy_Profiles_with_Univers_c0f556e02e.md](${base}/notes/crossref_Reweighting_Free_Energy_Profiles_with_Univers_c0f556e02e.md)."
          close 199 "This source is already captured in [notes/189_ag-salinga_fastatomstruct.md](${base}/notes/189_ag-salinga_fastatomstruct.md)."
          close 143 "This source is already captured in [notes/191_A_latent-space_extrapolation_grade_built_into_grap.md](${base}/notes/191_A_latent-space_extrapolation_grade_built_into_grap.md)."
          close 174 "Closed because this issue has no URL or DOI to capture."
          close 211 "Captured in [notes/211_NVIDIA_nvalchemi-toolkit.md](${base}/notes/211_NVIDIA_nvalchemi-toolkit.md)."
          close 209 "Captured in [notes/209_Awesome_MCP_Servers.md](${base}/notes/209_Awesome_MCP_Servers.md)."
