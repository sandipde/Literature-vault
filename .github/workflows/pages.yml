name: Deploy Pages

# The site is a handful of static files. Publishing from the branch rebuilds it on every push to
# main, including each captured note and scan commit. This workflow redeploys only when a file
# the site actually serves changes. Run it manually from the Actions tab to force a redeploy.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.json
      - icon.svg
      - icon-192.png
      - icon-512.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html sw.js manifest.json icon.svg icon-192.png icon-512.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
